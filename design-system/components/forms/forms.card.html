<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--surface-page);font-family:var(--font-body)"></div>
<script type="text/babel">
window.Icon = window.Icon || window.LittlesFiddlesDesignSystem_4b8e28.Icon;
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch, QuantityStepper } = window.LittlesFiddlesDesignSystem_4b8e28;
function Demo(){
  const [qty,setQty]=React.useState(2);
  const [chk,setChk]=React.useState(true);
  const [sw,setSw]=React.useState(true);
  return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
      <Button variant="primary" icon="plus">Add to Rack</Button>
      <Button variant="secondary">Save Draft</Button>
      <Button variant="ghost">Cancel</Button>
      <Button variant="danger">Remove</Button>
      <Button size="sm">Small</Button>
      <IconButton icon="search" label="Search" />
      <IconButton icon="crossmark" label="Remove" variant="filled" />
    </div>
    <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'flex-start'}}>
      <div style={{width:200}}><Input label="SKU" icon="receipt" placeholder="LF-00123" /></div>
      <div style={{width:200}}><Select label="Size" placeholder="Choose" options={[{label:'2T',value:'2t'},{label:'4T',value:'4t'}]} /></div>
      <QuantityStepper value={qty} onChange={setQty} />
    </div>
    <div style={{display:'flex',gap:20,alignItems:'center'}}>
      <Checkbox label="Select all" checked={chk} onChange={()=>setChk(!chk)} />
      <Radio name="d" label="In-store" checked={true} onChange={()=>{}} />
      <Radio name="d" label="Curbside" checked={false} onChange={()=>{}} />
      <Switch label="Email me when sold" checked={sw} onChange={setSw} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
