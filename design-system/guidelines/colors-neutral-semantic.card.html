<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals & semantic" subtitle="Warm ink scale + sage success / mustard warning / wine danger / sky info" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:100%;display:flex;flex-direction:column;font-family:var(--font-body);font-size:12px">
<div style="flex:1;display:flex">
<div style="flex:1;background:var(--ink-900);color:#fff;display:flex;align-items:center;justify-content:center">ink-900</div>
<div style="flex:1;background:var(--ink-500);color:#fff;display:flex;align-items:center;justify-content:center">ink-500</div>
<div style="flex:1;background:var(--ink-300);color:var(--ink-900);display:flex;align-items:center;justify-content:center">ink-300</div>
<div style="flex:1;background:var(--ink-100);color:var(--ink-900);display:flex;align-items:center;justify-content:center">ink-100</div>
<div style="flex:1;background:var(--paper);color:var(--ink-900);display:flex;align-items:center;justify-content:center;border-left:1px solid var(--surface-border)">paper</div>
</div>
<div style="flex:1;display:flex">
<div style="flex:1;background:var(--color-success);color:#fff;display:flex;align-items:center;justify-content:center">success</div>
<div style="flex:1;background:var(--color-warning);color:#fff;display:flex;align-items:center;justify-content:center">warning</div>
<div style="flex:1;background:var(--color-danger);color:#fff;display:flex;align-items:center;justify-content:center">danger</div>
<div style="flex:1;background:var(--color-info);color:#fff;display:flex;align-items:center;justify-content:center">info</div>
</div>
</div>
